name: KOSPI close report

on:
  workflow_dispatch:
    inputs:
      send_to_friends:
        description: "Send this manual run to connected KakaoTalk friends"
        required: false
        type: boolean
        default: false
  schedule:
    # 16:20 KST, Monday-Friday (GitHub cron uses UTC)
    - cron: "20 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore last successful report data
        uses: actions/cache@v4
        with:
          path: work/cache/*.json
          key: report-data-${{ github.run_id }}
          restore-keys: |
            report-data-
            investor-flow-
      - run: pip install -r requirements.txt
      - name: Check KOSPI trading day
        id: trading_day
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from pykrx import stock

          # Manual runs are tests and may run on weekends or exchange holidays.
          if os.environ.get("GITHUB_EVENT_NAME") != "schedule":
              is_open = True
              reason = "manual test run"
          else:
              today = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y%m%d")
              quotes = stock.get_market_ohlcv_by_ticker(today, market="KOSPI")
              is_open = not quotes.empty
              reason = f"KOSPI trading data for {today}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_open={str(is_open).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              status = "open" if is_open else "closed"
              summary.write(f"## KOSPI market: {status}\n\n{reason}\n")
          print(f"Trading-day check: {is_open} ({reason})")
          PY
      - id: generate
        if: steps.trading_day.outputs.is_open == 'true'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          set -o pipefail
          summary=$(python scripts/generate_report.py | tail -n 1)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.trading_day.outputs.is_open == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.trading_day.outputs.is_open == 'true'
        with:
          path: site
      - name: Deploy GitHub Pages
        if: steps.trading_day.outputs.is_open == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send KakaoTalk notification
        if: steps.trading_day.outputs.is_open == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_SUMMARY: ${{ steps.generate.outputs.summary }}
          SEND_TO_FRIENDS: ${{ github.event_name == 'schedule' || inputs.send_to_friends == true }}
        run: python scripts/send_kakao.py
