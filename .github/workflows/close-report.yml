name: Archive KOSPI close report

on:
  workflow_dispatch:
    inputs:
      send_to_friends:
        description: "Send the existing GCS report link to connected KakaoTalk friends"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub cron is UTC. Fetch the GCS report after its 17:00 / 18:00 KST production.
    - cron: "10 8 * * 1-5"
    - cron: "10 9 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kospi-pages
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy the GCS report without regenerating it
        id: archive
        shell: bash
        env:
          REPORT_URL: https://storage.googleapis.com/hip-girder-355005-market-reports/kospi/index.html
        run: |
          set -euo pipefail
          report_date=$(TZ=Asia/Seoul date +%F)
          mkdir -p site/archive
          curl --fail --location --retry 2 --retry-delay 5 "$REPORT_URL" -o "site/archive/$report_date.html"
          test -s "site/archive/$report_date.html"
          cp "site/archive/$report_date.html" site/index.html
          {
            echo '<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>코스피 장마감 리포트 아카이브</title></head><body>'
            echo '<h1>코스피 장마감 리포트 아카이브</h1><ul>'
            for file in $(find site/archive -maxdepth 1 -type f -name '????-??-??.html' -printf '%f\n' | sort -r); do
              printf '<li><a href="%s">%s</a></li>\n' "$file" "${file%.html}"
            done
            echo '</ul></body></html>'
          } > site/archive/index.html
          echo "date=$report_date" >> "$GITHUB_OUTPUT"

      - name: Save the copied report archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/archive
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Archive GCS KOSPI report for ${{ steps.archive.outputs.date }}"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' && github.event.schedule == '10 8 * * 1-5' || inputs.send_to_friends == true
        with:
          python-version: "3.12"
          cache: pip

      - name: Install notification dependencies
        if: github.event_name == 'schedule' && github.event.schedule == '10 8 * * 1-5' || inputs.send_to_friends == true
        run: pip install -r requirements.txt

      - name: Send the original GCS URL by KakaoTalk
        if: github.event_name == 'schedule' && github.event.schedule == '10 8 * * 1-5' || inputs.send_to_friends == true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          REPORT_URL: https://storage.googleapis.com/hip-girder-355005-market-reports/kospi/index.html
          REPORT_SUMMARY: "코스피 장마감 리포트 (${{ steps.archive.outputs.date }})"
          SEND_TO_FRIENDS: "true"
          KAKAO_EXPECTED_FRIEND_COUNT: "3"
        run: python scripts/send_kakao.py
